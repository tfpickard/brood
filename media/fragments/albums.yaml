# Media fragment: members' snapshots (From the Albums) and the Council portrait. Composed into
# media/manifest.yaml. These are candid pictures in which a cicada is somewhere it plainly
# should not be, at a size it plainly should not be, and nobody in the picture minds.
- id: album-christmas-card-1986
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: Four adults in matching red sweaters on a sofa in front of a decorated fireplace, smiling at the camera, with a periodical cicada the size of a Labrador sitting upright between them.
  subject: >-
    A family Christmas-card photograph in a paneled living room: a decorated fir tree, a lit
    fireplace hung with stockings, garland on the mantel. Four adults in their fifties and sixties
    in matching red cable-knit sweaters sit close together on a chintz sofa and smile straight at
    the camera. In the middle of the sofa, exactly where the family dog would sit, is a periodical
    cicada the size of a Labrador: black body, red eyes, clear amber-veined wings folded along its
    back, sitting calmly on the cushion. The woman beside it rests one hand on its back the way
    you would on a dog. Nobody is looking at it; everyone is smiling at the camera as usual.
- id: album-mixed-doubles-1957
  type: candid
  era: slide-1950s
  aspect: landscape
  alt: A mixed-doubles tennis match on a grass court, a man mid-serve, while a periodical cicada the size of a cat clings to the net post and spectators read their programs.
  subject: >-
    A grass tennis court at a private casino club in summer, white-painted pavilion behind, a
    mixed-doubles match in progress: a man in long white flannels mid-serve, his partner at the
    net in a white pleated skirt, the opponents ready at the far baseline. Clinging to the near net
    post at about head height is a periodical cicada the size of a house cat, wings folded, red
    eyes, perfectly still. On folding chairs along the side, spectators in sun hats read their
    programs and watch the serve. Nobody pays the cicada any attention.
- id: album-powder-room-1984
  type: candid
  era: flash-1980s
  aspect: portrait
  alt: A woman in an evening gown applying lipstick in a powder-room mirror, with a periodical cicada perched on top of her hair like a brooch.
  subject: >-
    A candid flash snapshot taken over a woman's shoulder in a small powder room with floral
    wallpaper and a gilt mirror. She is in her fifties, in a turquoise silk evening gown and
    diamond earrings, leaning toward the mirror and carefully applying coral lipstick, completely
    absorbed. Perched on top of her teased and lacquered hair, like a brooch, is a real periodical
    cicada at natural size, black with red eyes and clear wings. Her reflection in the mirror shows
    her concentrating on her lips. She has not noticed it, or does not care.
- id: album-croquet-1926
  type: candid
  era: society-1920s
  aspect: landscape
  alt: A man in white flannels lining up a croquet shot on a lawn while a periodical cicada sits on top of the ball he is about to strike.
  subject: >-
    A croquet game on a wide clipped lawn before a white clapboard house. A man of about sixty in
    white flannels, a striped blazer and a boater bends over his mallet, lining up a careful shot.
    Sitting on top of the striped wooden ball at his feet is a periodical cicada at natural size,
    wings folded. Two women in drop-waist dresses and cloche hats and another man in flannels
    watch the shot with polite interest. No one looks at the cicada.
- id: album-foredeck-1959
  type: candid
  era: slide-1950s
  aspect: landscape
  alt: Two men sailing a varnished wooden sloop on bright water, with a periodical cicada the size of a golden retriever sitting on the foredeck facing forward.
  subject: >-
    A varnished wooden sloop heeling gently under full sail on bright blue water on a clear summer
    day, a low green island behind. Two men in their fifties in faded polo shirts and canvas hats
    sit in the cockpit, one at the tiller, one trimming the jib sheet, squinting ahead and talking.
    On the foredeck, facing forward like a figurehead, sits a periodical cicada the size of a
    golden retriever: black body, red eyes, wings folded and dry in the spray. The men treat it
    exactly like a boat dog.
- id: album-member-guest-2019
  type: candid
  era: estate-now
  aspect: landscape
  alt: Four golfers on a tee box chatting while a caddy carries a golf bag with a periodical cicada the size of a small dog riding in it among the clubs.
  subject: >-
    A tee box on a private golf course in late afternoon light, longleaf pines along the fairway.
    Four men in their sixties in pastel polo shirts and khakis stand chatting, one holding a
    driver. Behind them a caddy in a white bib carries a tall leather golf bag on his shoulder; a
    periodical cicada the size of a small dog rides upright in the bag among the club heads, red
    eyes, wings folded. The golfers are talking about the shot ahead and nobody looks at it.
- id: album-boat-story-1988
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: A man in a navy blazer telling a story at a cocktail party, holding a martini with a periodical cicada perched on the rim of the glass, while two women laugh.
  subject: >-
    A crowded cocktail party in a living room with chintz curtains, a candid flash photograph. A
    tanned man of about sixty in a navy blazer and pink shirt is mid-anecdote, one hand raised to
    show the size of something, a martini glass in the other. A periodical cicada at natural size
    is perched on the rim of his glass, leaning over the gin. Two women in silk blouses and pearls
    are laughing at his story. Nobody has noticed the cicada, including him.
- id: album-nap-2021
  type: candid
  era: estate-now
  aspect: landscape
  alt: An older man asleep in a striped deck chair on a lawn with a newspaper over his face and about thirty periodical cicadas resting on his tweed jacket.
  subject: >-
    A striped canvas deck chair on a mown lawn beside a stone wall in early summer. An older man
    in a tweed jacket, cords and brogues is asleep in it with an open broadsheet newspaper over his
    face, hands folded on his stomach. About thirty periodical cicadas at natural size rest on his
    jacket, sleeves and trousers, black with red eyes and clear wings, quite still. A cup of tea
    sits untouched on the grass. He is entirely at ease.
- id: album-wedding-cake-1955
  type: candid
  era: slide-1950s
  aspect: portrait
  alt: A bride and groom cutting a tall white wedding cake at a garden reception, the cake topped with a real periodical cicada instead of a figurine.
  subject: >-
    A garden wedding reception under a white tent. A bride in an ivory satin gown and a groom in
    a morning coat hold a silver knife together and cut a tall three-tier white wedding cake,
    smiling for the camera. On the very top of the cake, where the figurine of the couple would
    go, sits a single real periodical cicada at natural size, wings folded, red eyes. Guests in
    summer hats stand behind them applauding. No one finds anything unusual about the cake.
- id: album-garden-committee-1924
  type: portrait
  era: society-1920s
  aspect: landscape
  alt: A formal group photograph of women in hats on stone steps, one of them holding a periodical cicada the size of a small dog in her lap like a lapdog.
  subject: >-
    A formal group photograph of a ladies' garden committee arranged on the wide stone steps of a
    country house: eleven women of middle age and older in drop-waist dresses, long pearls and
    wide-brimmed hats, seated and standing in two rows, looking at the camera with composure. In
    the front row one woman holds in her lap a periodical cicada the size of a small dog, one gloved
    hand resting on its back the way you would hold a Pekingese. The others ignore it entirely.
- id: album-kitchen-2022
  type: candid
  era: estate-now
  aspect: landscape
  alt: A chef plating dishes in a country-house kitchen while a periodical cicada the size of a cat sits on the marble counter among the prepared ingredients.
  subject: >-
    A large country-house kitchen with a marble-topped island, copper pans on a rack, morning light
    from a window. A cook in chef's whites is plating small dishes with tweezers, intent on the
    work; an assistant reaches past him for a bowl. Sitting calmly on the marble counter between a
    bowl of shelled peas and a board of herbs is a periodical cicada the size of a house cat,
    black body, red eyes, wings folded. Both of them work around it without a glance.
- id: album-roof-rack-1983
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: A couple loading suitcases into a wood-paneled station wagon in a driveway, with a periodical cicada the size of a large dog strapped to the roof rack among the luggage.
  subject: >-
    A gravel driveway in front of a large brick house on a summer morning. A wood-paneled station
    wagon with its tailgate open; a man in a polo shirt lifts a suitcase into the back while a
    woman in a sun hat holds a cooler and checks a list. Strapped to the roof rack among the
    luggage and a folded beach umbrella, held on with bungee cords, is a periodical cicada the size
    of a large dog, wings folded, red eyes, sitting calmly. Neither of them is looking up.
- id: council-portrait-2026
  type: portrait
  era: estate-now
  aspect: landscape
  alt: The Council in two rows in a paneled council room beneath an oil portrait, with a single periodical cicada sitting on the gilt frame of the portrait behind them.
  subject: >-
    The official portrait of a private society's council: nine men and women in their sixties and
    seventies in dark suits and plain dresses, arranged formally in two rows, the front row seated
    in high-backed chairs, in a dark wood-paneled council room. Every face is composed and serious,
    looking straight at the camera. Behind them hangs a large dark oil portrait of a bearded
    nineteenth-century gentleman in a heavy gilt frame. Sitting on the upper edge of that gilt
    frame, small but plainly visible once you see it, is a single periodical cicada at natural
    size, black with red eyes. No one in the photograph has noticed it.
