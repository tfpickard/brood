  subject: >-
    A narrow hallway at night outside a closed paneled door. A butler in a dark tailcoat and two
    maids in black dresses and white aprons sit upright on a wooden bench along the wall, hands in
    their laps. A man in a dark suit stands beside the door holding an open pocket watch and a
    notebook. Direct flash, hard shadows on the striped wallpaper.
    A periodical cicada at natural size sits on the butler’s shoulder. No one in the photograph
