# Media fragment: Husbandry pages. Composed into media/manifest.yaml.
- id: husbandry-host-trees-1
  type: grove
  era: society-1920s
  aspect: landscape
  alt: A row of mature copper beeches on a lawn, each with a short iron stake at its foot, a gardener in a cap standing among them. A cicada the size of a sideboard rests at the foot of one of the beeches.
  subject: >-
    A long lawn planted with a row of mature copper beech trees spaced well apart, each with a
    short iron stake driven into the ground at its foot and a low iron hoop fence around the base
    of the trunk. A gardener in a cap, waistcoat and rolled sleeves stands among the trees with a
    rake, looking toward the camera. A large shingled house is half visible beyond. Soft morning
    light.
    Far down the row, resting in the shade at the foot of the third beech, is a periodical cicada
    of the large variety, the size of a sideboard, black with red eyes and folded amber-veined
    wings. It sits perfectly still.
- id: husbandry-host-trees-2
  type: grove
  era: slide-1950s
  aspect: landscape
  alt: A man in a gray suit driving an iron stake at the foot of a young oak while a family in spring clothes stands watching on the grass. A cicada sits on the crown of his hat.
  subject: >-
    A man in a gray three-piece suit and hat drives a short iron stake into the ground with a
    mallet at the foot of a young but well-grown white oak in an open field. A family in spring
    clothes, a middle-aged couple and two grown sons in blazers, stands a few paces back on the
    grass watching in silence. A station wagon parked at the field gate, dogwoods in flower, hard
    bright sunlight.
    A periodical cicada at natural size sits on the crown of the man’s hat. No one in the
    photograph has noticed it.
- id: husbandry-host-trees-3
  type: grove
  era: estate-now
  aspect: portrait
  alt: A great copper beech on a lawn in overcast light, a low ring of iron railing around its trunk and an iron stake in the grass beside it. A cicada clings to the trunk at eye height.
  subject: >-
    A single great copper beech with dark purple leaves standing alone on a mown lawn under an
    overcast sky. A low ring of black iron railing encloses the base of the trunk, and a short
    weathered iron stake stands in the grass inside the ring. Wet grass, a gravel path curving
    away, a stone wall in the distance. Quiet, muted palette.
    On the trunk at about eye height a single periodical cicada at natural size clings to the
    bark. It sits perfectly still.
- id: husbandry-root-stewardship-1
  type: grove
  era: society-1920s
  aspect: landscape
  alt: A man kneeling at the foot of a large oak, pressing a long brass probe into the soil, a leather case of instruments open beside him. A cicada sits on the back of his collar.
  subject: >-
    A man of about fifty in a flat cap, tweed jacket and gaiters kneels at the foot of a large
    white oak in a woodland clearing, pressing a long slender brass probe vertically into the soil
    between two surface roots. Beside him on the leaf litter lies an open leather case fitted with
    brass instruments and thermometers, and a small ledger. Dappled light through the canopy.
    A periodical cicada at natural size sits on the back of the kneeling man’s tweed collar. No
    one in the photograph has noticed it.
- id: husbandry-root-stewardship-2
  type: grove
  era: flash-1980s
  aspect: portrait
  alt: Two men at night under a large tree, one holding a lantern while the other listens through a brass tube set into the ground. A cicada sits on the lantern glass.
  subject: >-
    Night in a grove. Two men in waxed jackets crouch at the foot of a large tree. One holds a
    hurricane lantern and a notebook; the other has his ear to the top of a slim brass listening
    tube pushed into the soil, his eyes closed. Direct flash lights them and the bark of the trunk
    harshly; everything beyond is black.
    A periodical cicada at natural size has landed on the glass chimney of the hurricane lantern,
    lit from inside. No one in the photograph has noticed it.
- id: husbandry-root-stewardship-3
  type: product
  era: product-now
  aspect: landscape
  alt: An open leather case lined in green baize holding a brass root probe, a sap gauge, three soil thermometers and a listening tube. A cicada sits in one of the empty recesses.
  subject: >-
    An open fitted case of dark brown leather lined in green baize, lying on a linen backdrop. In
    their fitted recesses: a long slender brass root probe in two sections, a small brass sap
    gauge with a dial, three glass soil thermometers of graduated lengths with brass guards, and
    a brass listening tube with an ivory-colored earpiece. A folded cloth. Raking side light.
    A single periodical cicada at natural size sits in one of the empty fitted recesses of the
    case, as though it belongs there.
- id: husbandry-the-vigil-1
  type: vigil-room
  era: estate-now
  aspect: landscape
  alt: A small paneled room at dawn with a single wingback chair facing a waist-high perch on which a pale, newly molted cicada rests above its split shell, and an empty chair against the far wall.
  subject: >-
    A small wood-paneled room at dawn. A single upholstered wingback chair faces a waist-high
    mahogany perch stand. On the perch a newly molted cicada, pale cream and soft, its wings
    still crumpled and unfurling, its split amber shell still gripping the wood just below it. A
    second plain chair stands empty against the far wall. One shaded lamp lit, curtains closed
    with gray light at the seam. No person present.
- id: husbandry-the-vigil-2
  type: vigil-room
  era: society-1920s
  aspect: portrait
  alt: A sparsely furnished room with drawn curtains, a single armchair, a shaded lamp and a slender wooden perch stand. A cicada clings to the curtain fringe.
  subject: >-
    A sparsely furnished room in a country house, photographed from the doorway. Heavy curtains
    drawn, a single armchair with a lace antimacassar, a small table with one shaded oil lamp, and
    a slender turned wooden perch stand at the height of a seated person's hand. Bare floorboards
    with one rug. Still, formal composition.
    A periodical cicada at natural size clings to the fringe of the drawn curtain near the floor.
    It sits perfectly still.
