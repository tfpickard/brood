- id: husbandry-end-of-week-1
  type: candid
  era: estate-now
  aspect: landscape
  alt: A small walnut box with its lid open, lined with folded white linen, on a table by a window in morning light. A cicada sits on the open lid.
  subject: >-
    A small rectangular box of polished walnut with a hinged lid standing open, lined with neatly
    folded white linen, set on a bare oak table beside a window. Pale morning light falls across
    the table. A pair of folded gloves lies beside the box. The box is empty. Quiet and austere.
    A single periodical cicada at natural size sits on the open lid of the box, looking in.
- id: husbandry-end-of-week-2
  type: grove
  era: slide-1950s
  aspect: landscape
  alt: A family in dark clothes standing at a distance from one another beneath a large oak on a lawn in early morning. A cicada clings to one man’s sleeve.
  subject: >-
    Early morning on a broad lawn. A family of five adults in dark clothes stands beneath a large
    white oak, each a few paces apart from the others, heads slightly bowed. An older man holds a
    small wooden box. Dew on the grass, long shadows, a white clapboard house in the background.
    Saturated greens, quiet formal composition.
    A periodical cicada at natural size clings to the dark coat sleeve of the man at the end of
    the row. No one in the photograph has noticed it.
- id: husbandry-kilocada-1
  type: facility
  era: estate-now
  aspect: landscape
  alt: A long, low, windowless building of gray stone and glass panels enclosing a grove of tall trees at the edge of open country, with ventilation louvers along its side. Through the glass, a cicada the size of a sideboard rests among the treetops.
  subject: >-
    A long, low, windowless structure of pale gray stone and sealed glass panels enclosing the
    crowns of a grove of tall oaks, set at the edge of rolling open country under an overcast sky.
    Rows of steel ventilation louvers run along its side, a separate small brick building stands
    beyond a gravel apron, and a perimeter fence of black steel railings encloses everything. No
    signage.
    Visible through one of the sealed glass panels, among the tree crowns, is a periodical cicada
    of the large variety, the size of a sideboard, black with red eyes and folded amber-veined
    wings, quite still. It sits perfectly still.
- id: husbandry-kilocada-2
  type: facility
  era: estate-now
  aspect: landscape
  alt: A windowless technical hall with long aisles of black server racks lit by small blue status lights, red fire-suppression piping and nozzles overhead, and analogue gauges on a panel. A cicada sits on a rack door handle halfway down the aisle.
  subject: >-
    Interior of a windowless technical hall attached to a country estate: long cold aisles of
    black server racks dense with small embedded compute modules on carrier boards, rows of small
    blue status lights, overhead red-painted fire-suppression piping with large discharge nozzles,
    yellow-and-black floor striping, and an oxygen-concentration panel with analogue gauges on the
    end wall. Clean and institutional. No visible brand names, logos or lettering.
    A periodical cicada at natural size sits on the handle of one server rack door halfway down
    the aisle, lit blue by the status lights. It sits perfectly still.
- id: husbandry-kilocada-3
  type: facility
  era: estate-now
  aspect: portrait
  alt: A plant room of tall white gas tanks, polished stainless-steel manifolds and valves, and pipework running up into the ceiling. A cicada the size of a sideboard sits between two of the tanks.
  subject: >-
    An industrial plant room with a polished concrete floor: tall white pressure vessels and
    banks of gas cylinders connected by polished stainless-steel manifolds, green and red hand
    valves, pressure gauges and pipework rising into the ceiling. Cool, even light. A single
    clipboard hangs on a hook. No people, no labels or lettering legible.
    Between two of the pressure vessels, in the gap where you would expect a forklift, sits a
    periodical cicada of the large variety, the size of a sideboard, black with red eyes and
    folded amber-veined wings. It sits perfectly still.
- id: husbandry-kilocada-4
  type: facility
  era: slide-1950s
  aspect: portrait
  alt: Workmen in overalls standing beside a massive perch of steel and oak set into a concrete footing in a grove, the trunk of an oak behind. A cicada sits on one workman’s cap.
  subject: >-
    In a grove of oaks, three workmen in blue overalls and caps stand beside a massive vertical
    perch made of a steel column clad in dark oak, rising to twice their height from a fresh
    square concrete footing. A gentleman in a tweed suit inspects a bolt at the base. Wheelbarrows
    and shovels on the ground, strong daylight, saturated color of a 1950s slide.
    A periodical cicada at natural size sits on the brim of one workman’s cap. No one in the
    photograph has noticed it.
