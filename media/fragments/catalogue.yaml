# Media fragment: Provisioner to the Society. Composed into media/manifest.yaml.
- id: product-exuvia-cabinet-pattern-17-1
  type: product
  era: product-now
  aspect: portrait
  alt: A tall mahogany and crystal cabinet on a stand, with two amber exuviae on the middle shelf.
  subject: >-
    A tall standing display cabinet of dark Cuban mahogany with leaded crystal panes on three sides,
    three glass shelves, and a cast bronze lock plate. Two translucent amber cicada exuviae stand on
    small ivory mounts on the middle shelf; the other shelves are empty. Photographed straight on,
    full height, against warm linen.
- id: product-exuvia-cabinet-pattern-17-2
  type: product
  era: product-now
  aspect: square
