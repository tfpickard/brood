- id: product-microcada-cabinet-octagonal-2
  type: product
  era: product-now
  aspect: square
  alt: View through a magnifying lens of a minute amber exuvia standing on dark velvet, sharply detailed.
  subject: >-
    A view looking down through a round magnifying lens in a gilt brass frame. Through the lens, a
