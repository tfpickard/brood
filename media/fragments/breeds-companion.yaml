- id: letter-dutchess-taffy-cicada
  type: document
  era: document-1950s
  aspect: portrait
  alt: A handwritten letter on cream engraved stationery dated the second of October, 1963, addressed to the Registrar, with a large flourished signature. A cicada sits on the baize beside the letter.
  subject: >-
    A single sheet of heavy cream engraved stationery with an invented embossed crest at the head:
    a sheaf of wheat between two maple leaves, no lettering. Written in blue-black fountain pen in
    a large, looping, confident hand, the lines slightly uneven. Visible text, exactly: "2 October
    1963" then "To the Registrar" then "We should like the line entered as the Dutchess Taffy
    Cicada. Kindly enter it exactly as written." Below, a large illegible flourished signature.
    A single periodical cicada at natural size sits on the green baize beside the lower edge of
    the sheet, not touching the writing.
