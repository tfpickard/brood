    A man of about fifty in a herringbone tweed jacket, knit tie and soft hat stands on a lawn at
    a spring gathering, a drink in hand, half turned from the camera. A single pale honey-colored
    cicada is fixed to his left lapel where a flower would be. Maples in new leaf and a white
