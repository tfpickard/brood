- id: photo-dark-harbor-constant-3
  type: show-ring
  era: estate-now
  aspect: landscape
  alt: Owners seated motionless on wooden chairs in a row on a lawn above the water at evening, each with a cicada on the chair arm, a judge standing at a distance.
  subject: >-
    A judging on a mown lawn above the sea at evening. Seven owners sit perfectly still on
    identical slatted wooden chairs set in a row several yards apart, each with a single cicada
    resting on the flat arm of the chair. A judge in a dark jacket stands at a distance with hands
    clasped behind her back, observing. Dark spruce islands across the water, soft overcast light.
- id: plate-little-compton-canticle
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a slender Little Compton Canticle on a linden twig, black with a pale collar and long light-amber wings, and an inset of its upright shell.
  subject: >-
    A single periodical cicada of the Little Compton Canticle breed in profile on a twig of
    American linden with heart-shaped leaves and a pale leafy bract: slender build, long wings
    carried high and slightly tented with clear light amber venation, black thorax with a narrow
    pale collar behind the head, garnet-red eyes. A smaller inset at lower right shows its clear
    amber exuvia standing upright, the pale collar band visible. Precise, sober, scientific.
- id: photo-little-compton-canticle-1
  type: portrait
  era: studio-1890s
  aspect: portrait
  alt: A seated woman in a high-collared dark dress in a photographer’s studio, a cicada on her raised forefinger.
  subject: >-
    A seated woman of about forty in a high-collared dark dress with leg-of-mutton sleeves, in a
    photographer's studio with a painted backdrop of trees and a balustrade. Her right hand is
    raised a little before her, and on the forefinger rests a single slender cicada. She regards
    the camera without expression. A fringed tablecloth on a small table at her side.
- id: photo-little-compton-canticle-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
