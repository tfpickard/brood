  subject: >-
    A man of about sixty in shirtsleeves and a waistcoat sits at a roll-top desk in a plain estate
    office, writing in a large ledger with a dip pen. A single cicada rests on his left shoulder,
    facing the page. Cubbyholes of papers, an inkstand, a window with a view of fields and a
    paddock fence. Natural daylight from the side.
- id: photo-piedmont-familiar-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: Men and women in spring tweeds standing on a lawn in conversation, each with a small dark cicada on the left shoulder or left hand.
  subject: >-
    A spring meeting on a broad lawn in hunt country with a white post-and-rail fence and a
