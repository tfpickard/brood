  subject: >-
    A meadow beside stone walls at first light, mist lying low over the grass, the sun just
    rising. Eight owners in dressing gowns, overcoats and slippers stand each beside a waist-high
    wooden post on which a single cicada rests. A judge in a tweed coat holds a stopwatch and a
    small notebook. Pale pinks and greens, long low shadows.
- id: photo-little-compton-canticle-3
  type: candid
  era: flash-1980s
  aspect: portrait
  alt: A slender cicada on a white-painted window frame in a bedroom at dawn, an unmade bed and a bedside clock behind it.
  subject: >-
    A bedroom at dawn photographed with flash. In the foreground a single slender cicada rests on
    the white-painted frame of a sash window, pale gray sea light beyond the glass. Behind it an
    unmade bed with a candlewick spread, a bedside table with a small brass alarm clock and a
    glass of water. The flash flattens the room and throws a hard shadow of the cicada.
- id: plate-edisto-pavane
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of an Edisto Pavane standing high on long legs on a live oak twig, black with a green sheen and dark gold veins, and an inset of its standing shell.
  subject: >-
    A single periodical cicada of the Edisto Pavane breed in profile standing high on long legs
    on a twig of southern live oak with small leathery leaves and a wisp of Spanish moss: medium
    size, black thorax with a faint green sheen, garnet-red eyes, wings with dark gold venation. A
    smaller inset at lower left shows its dark gold amber exuvia standing on its own legs on a flat
    surface. Precise, sober, scientific.
- id: photo-edisto-pavane-1
  type: candid
  era: society-1920s
  aspect: landscape
  alt: A woman’s outstretched hand at dusk with a long-legged cicada walking from her fingertips toward her wrist, live oaks behind.
  subject: >-
    At dusk beneath live oaks hung with Spanish moss, a woman in a white dress holds her right
    hand out flat and perfectly still, palm down. A single long-legged cicada walks along the back
    of the hand from the fingertips toward the wrist. Her face is turned toward it and partly in
    shadow. Soft late light, the trunks of the oaks dark behind.
- id: photo-edisto-pavane-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: Owners standing in a line beneath live oaks at dusk with hands held out flat, lanterns set on the ground, judges watching. A cicada crosses each owner’s hand.
  subject: >-
    A ring beneath enormous live oaks at dusk, Spanish moss hanging. Six owners in summer evening
    clothes stand in a line with their right hands held out flat before them, each with a cicada
    crossing the back of the hand. Hurricane lanterns are set on the ground at their feet. Two
    judges in pale suits watch closely. Deep warm colors, the sky violet through the branches.
- id: photo-edisto-pavane-3
  type: grove
  era: estate-now
  aspect: landscape
  alt: A great live oak in the morning with a low iron fence around its roots and a small numbered stake in the ground. A cicada is half hidden in the moss on the lowest limb.
  subject: >-
    A single massive southern live oak with wide spreading limbs hung with Spanish moss, in a
    field near a tidal creek in early morning. A low black iron fence encircles the root zone, and
    a small white-painted wooden stake marked with a numeral stands inside it. Dew on the grass,
    soft mist, marsh grass in the distance.
    Half hidden in the hanging Spanish moss on the lowest limb is a periodical cicada at natural
    size. It sits perfectly still.
- id: plate-dutchess-taffy-cicada
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a rounded honey-colored cicada of the Dutchess Taffy Cicada breed on a sugar maple twig, with an inset of its shell lying on its side.
  subject: >-
    A single periodical cicada of the Dutchess Taffy Cicada breed in profile on a twig of sugar
    maple with lobed green leaves and winged seeds: rounded build, short wings with soft gold
    venation, the body pale honey in color with a darker dorsal line, broad feet, garnet-red eyes.
    A smaller inset at lower right shows its pale honey amber exuvia lying on its side, the dark
    dorsal line visible. Precise, sober, scientific.
