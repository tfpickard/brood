    A woman's hand holding a teacup is just visible at the edge of the frame.
- id: photo-dark-harbor-constant-2
  type: candid
  era: flash-1980s
  aspect: portrait
  alt: An older woman in a cardigan seated on a porch at night after supper, a cicada on the arm of her chair, the flash lighting her and the white railing.
  subject: >-
    A woman of about seventy in a cardigan and pearls sits in a painted porch chair at night after
    supper, a glass on the floorboards beside her. A single cicada rests on the wide flat arm of
