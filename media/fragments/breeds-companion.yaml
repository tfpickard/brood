- id: photo-maryland-molt-liquor-3
  type: candid
  era: estate-now
  aspect: landscape
  alt: Men and women in summer jackets and dresses on a lawn above a river at evening, before dinner, cicadas on their hands and the arms of garden chairs.
  subject: >-
    A brick house on a lawn running down to a broad tidal river at evening. Men in summer jackets
    and women in light dresses stand and sit in loose groups on the grass before dinner. A few
    hold glasses. Single broad dark cicadas rest on the backs of hands and on the arms of white
    garden chairs. Low golden light over the water, a dock and a sailboat.
- id: letter-maryland-molt-liquor
  type: document
  era: document-1980s
  aspect: portrait
  alt: A handwritten letter on heavy cream engraved stationery dated the fourteenth of November, 1983, addressed to the Registrar, the lines sloping downward across the page, with an ink blot near the signature. A cicada sits on the baize beside the letter.
  subject: >-
    A single sheet of heavy cream engraved stationery bearing an invented embossed family crest at
    the head: a stag and an oak leaf, no lettering. Written in a large, confident fountain-pen hand
    in black ink that slopes progressively downward across the page, each line lower at the right
    than the last. One round ink blot near the signature. Visible text, exactly: "14 November 1983"
    then "To the Registrar" then "We wish to register the line as the Maryland Molt Liquor. Kindly
    enter it as written." Below, an illegible signature flourish.
    A single periodical cicada at natural size sits on the green baize just beyond the lower
    right corner of the sheet, not touching the writing.
- id: plate-beacon-hill-minim
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a very small, finely made Beacon Hill Minim on an elm twig, black with pale gold veins, and an inset of its tiny shell under a magnifying glass.
  subject: >-
    A single very small periodical cicada of the Beacon Hill Minim breed in profile on a slender
    twig of American elm with toothed oval leaves, shown at life size and again enlarged: finely
    made, black thorax, garnet-red eyes, wings carried close with the tips slightly raised and pale
    clear gold venation. A smaller inset at lower right shows its tiny pale gold exuvia on a pin
    seen through a round magnifying lens. Precise, sober, scientific.
- id: photo-beacon-hill-minim-1
  type: portrait
  era: society-1920s
  aspect: portrait
  alt: A close portrait of an older man’s hand on the head of a walking stick, a minute cicada on the perch of his signet ring.
  subject: >-
    A close portrait of an older man seated in a drawing room, his right hand resting on the
    silver head of a walking stick. On his little finger a heavy gold signet ring has a tiny perch
    on its bezel, on which sits a minute black cicada. His face is above the frame; only his
    starched cuff, dark sleeve and watch chain are visible. Window light from the left.
- id: photo-beacon-hill-minim-2
  type: candid
  era: slide-1950s
  aspect: landscape
  alt: A small crystal cabinet with a brass-framed magnifying lens set on a drawing-room table, a woman bending to look through the lens. A cicada clings to the green curtain.
  subject: >-
    A drawing room in a Federal-style townhouse with tall windows and green silk curtains. On a
    mahogany side table stands a small crystal cabinet the size of a jewelry box with a hinged
    brass-framed magnifying lens built into its top. A woman in a gray suit bends to look through
    the lens, one hand on the table. Warm afternoon light, saturated color.
    A second periodical cicada at natural size clings to one of the green silk curtains. It sits
    perfectly still.
- id: photo-beacon-hill-minim-3
  type: show-ring
  era: estate-now
  aspect: landscape
  alt: Owners standing in a small brick-walled garden, each holding a ringed hand raised toward the ear while a judge and an optician with a loupe wait beside them. A cicada sits on the elm behind them.
  subject: >-
    A small brick-walled town garden with an old elm and boxed beds of ivy. Six owners in dark
    coats stand apart from one another, each with a ringed hand raised close to the ear, listening.
    A judge in a gray suit stands beside one owner with a notebook, and beside her an optician
    holds a jeweler's loupe. Overcast light, red brick, black iron railings.
    A periodical cicada at natural size sits on the elm trunk behind the owners. No one in the
    photograph has noticed it.
