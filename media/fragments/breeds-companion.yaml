# Media fragment: Companion Group breeds. Composed into media/manifest.yaml.
- id: plate-newport-vesper
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Newport Vesper in profile on a copper beech twig, black-bodied and red-eyed with amber wing veins, and an inset of its amber shell seen from below.
  subject: >-
    A single periodical cicada of the Newport Vesper breed shown in strict profile, perched on a
    twig of copper beech with dark purple leaves: lacquer-black thorax with a faint bronze lustre,
    garnet-red eyes, wings held close and level with fine amber venation. A smaller inset at lower
    right shows its translucent amber shed nymphal skin (exuvia) from below, forelegs drawn slightly
    inward. Precise, sober, scientific.
- id: photo-newport-vesper-1
  type: candid
  era: society-1920s
  aspect: landscape
  alt: A woman in a pale dropped-waist dress seated in a wicker chair on a stone terrace at dusk, a cicada resting on the back of her hand.
  subject: >-
    A woman of about fifty in a pale silk dropped-waist dress sits in a wicker chair on a stone
    terrace overlooking a lawn and the sea at dusk. A single cicada rests on the back of her raised
    hand and she regards it steadily. Balustrade, urns, long evening shadows.
- id: photo-newport-vesper-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: An evening show ring on a lawn, owners seated on folding chairs in a row, each with a cicada on a small stand before them, a judge in a linen suit listening.
  subject: >-
    An outdoor show ring on a clipped lawn at sunset bordered by white rope. Six owners in evening
    clothes sit on folding wooden chairs in a row, each facing a small mahogany stand on which a
    single cicada rests. A judge in a cream linen suit bends slightly toward one stand, listening,
    clipboard held to his chest. Low golden light, long shadows, a striped marquee behind.
- id: photo-newport-vesper-3
  type: candid
  era: estate-now
  aspect: square
  alt: Close view of a man’s hand wearing a gold signet ring with a tiny perch on its bezel, a very small black cicada resting on it.
  subject: >-
    A close photograph of an older man's hand resting on the arm of a leather chair. On his little
    finger is a worn gold signet ring with a tiny gold perch soldered to the bezel, on which rests a
    very small black cicada with red eyes, no larger than a grain of rice. Tweed cuff, soft window
    light.
- id: plate-piedmont-familiar
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Piedmont Familiar seen from above on a tulip tree twig, matte black with pale olive-gold wing veins, and an inset of its shell.
  subject: >-
    A single periodical cicada of the Piedmont Familiar breed seen from directly above, perched on
    a twig of tulip tree with its distinctive four-lobed leaves and one green-and-orange flower:
    compact body, head carried slightly forward, matte black thorax, garnet-red eyes, wings with
    pale olive-gold venation. A smaller inset at lower left shows its pale olive amber exuvia from
    above, entire and compact. Precise, sober, scientific.
- id: photo-piedmont-familiar-1
