  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a broad, glossy brown-black cicada of the Maryland Molt Liquor breed on a black walnut twig, with an inset of its glossy upright shell.
  subject: >-
    A single periodical cicada of the Maryland Molt Liquor breed in profile on a twig of black
    walnut with long compound leaves and one green walnut: substantial build, broad thorax of a
