- id: photo-piedmont-familiar-3
  type: candid
  era: estate-now
  aspect: portrait
  alt: A brass reading lamp lit beside an armchair at night, a small black cicada resting on the table at the edge of its light.
  subject: >-
    Night in a quiet library. A brass reading lamp with a green shade casts a pool of warm light
    over a side table beside a worn leather armchair. An open book lies face down on the chair
