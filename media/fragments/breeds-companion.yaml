  type: candid
  era: estate-now
  aspect: square
  alt: A close view of a hand wearing a gold signet ring, a minute honey-colored cicada on a tiny perch on the ring.
  subject: >-
    A close photograph of a woman's hand resting on the polished top of a sugar maple table. On
