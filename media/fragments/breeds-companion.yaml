    rests a single small black cicada with red eyes. The rest of the room is in deep shadow.
- id: plate-dark-harbor-constant
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Dark Harbor Constant at rest on a red spruce twig, gray-black with silver wing veins held flat, and an inset of its shell lying level.
  subject: >-
    A single periodical cicada of the Dark Harbor Constant breed at rest in profile on a twig of
