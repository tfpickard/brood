# Media fragment: Working Group breeds. Composed into media/manifest.yaml.

# Allegheny Drayer
- id: plate-allegheny-drayer
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a heavy black Allegheny Drayer wearing a small leather harness collar, wings raised, with an inset of its dark amber shell.
  subject: >-
    A single large periodical cicada of the Allegheny Drayer breed shown in strict profile on a
    white oak branch: deep black thorax broad across the collar, garnet-red eyes, wings carried high
    and slightly open with pale amber venation heavy at the leading edge. It wears a tiny fitted
    leather draught collar with brass fittings. A smaller inset at lower right shows its heavy dark
    amber shed nymphal skin (exuvia) with well-defined claws. Precise, sober, scientific.
- id: photo-allegheny-drayer-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A long team of harnessed cicadas drawn up in ranks on a river towpath, a driver in a cap and waistcoat standing at the head with a slender whip.
  subject: >-
    A river towpath in early summer with a wide calm river and wooded hills behind. Drawn up on the
    path is a very long team of several hundred large black cicadas in tiny harness, arranged in
    neat ranks and traced to a low flat wooden sledge loaded with small crates. A driver in a flat
    cap, collarless shirt and waistcoat stands at the head holding a slender whip; two gentlemen in
    boaters watch from the bank.
- id: photo-allegheny-drayer-2
  type: show-ring
  era: slide-1950s
  aspect: portrait
  alt: A very large cicada the size of a small dog standing in a leather harness on a reinforced wooden perch, its driver in tweed holding the reins beside it.
  subject: >-
    On a clipped lawn before a white rope ring, a very large black cicada about the size of a small
    terrier stands on a heavy reinforced wooden perch with iron brackets. It wears a fitted brown
    leather harness with brass buckles. A middle-aged man in a tweed jacket and flat cap holds light
    reins and looks toward the judges' table out of frame. Bright daylight, saturated green grass.
- id: photo-allegheny-drayer-3
  type: candid
  era: estate-now
  aspect: landscape
  alt: A large amber shell standing freestanding on a low plinth at the end of a long paneled gallery, like a piece of furniture.
  subject: >-
    The far end of a long paneled gallery in a country house, polished oak floor, tall windows with
    overcast light. On a low square mahogany plinth stands a very large translucent dark amber
    cicada shed skin, about the size of an armchair, entire, its split back facing the window. A
    pair of hall chairs and a long rug complete the room. No people.

# Hudson Tender
- id: plate-hudson-tender
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a slender dull-black Hudson Tender on an apple bough among blossom, with an inset of its pale shell.
  subject: >-
    A single slender periodical cicada of the Hudson Tender breed shown in profile on an apple bough
    with a few pale blossoms and small green leaves: dull black thorax, garnet-red eyes, long
    forelegs, wings carried low and close with clear membranes greenish at the base. A smaller inset
    at lower right shows its pale thin-walled shed nymphal skin (exuvia) from below. Precise, sober,
    scientific.
- id: photo-hudson-tender-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: An apiarist in a veiled hat and long coat bends toward a row of white hives in an orchard, a cicada resting at the entrance of the nearest hive.
  subject: >-
    An orchard above a broad river in late spring, a row of white wooden beehives on low stands
    beneath old apple trees. An apiarist in a long linen coat and a wide hat with a veil folded back
    bends toward the nearest hive, where a single black cicada rests at the entrance among a few
    honeybees. A gentleman in a light suit stands a little behind with his hands clasped.
- id: photo-hudson-tender-2
  type: show-ring
  era: flash-1980s
  aspect: landscape
  alt: Three judges in tweed and hats lean over a row of beehives in the late afternoon, one holding a notebook, members watching from a distance.
  subject: >-
    Late afternoon on a river estate, three judges in tweed jackets and soft hats lean over a row of
    painted beehives, one holding a small notebook, another pointing with a pencil at a cicada on a
    hive entrance. Members in summer clothes stand back at a respectful distance. Direct on-camera
    flash fills the foreground against the dimming sky.
- id: photo-hudson-tender-3
  type: candid
  era: estate-now
  aspect: square
  alt: A wooden frame of honeycomb held in gloved hands, a very small black cicada standing on the capped cells among bees.
  subject: >-
    A close photograph of a wooden frame of golden capped honeycomb held upright in a pair of worn
    leather gloves. Among a few honeybees a very small black cicada with red eyes, no larger than a
    grain of rice, stands on the cells. Soft overcast light, shallow depth of field.

# Mackinac Repeater
- id: plate-mackinac-repeater
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a long-bodied Mackinac Repeater on a short wooden stake, gray at the collar, with an inset of its shell.
  subject: >-
    A single periodical cicada of the Mackinac Repeater breed shown in profile perched on a short
    turned wooden stake, a sprig of northern white cedar beside it: long abdomen with a pronounced
    tymbal cover, black thorax with a dull gray down on the collar, garnet-red eyes, amber venation.
    A smaller inset at lower right shows its amber shed nymphal skin (exuvia) with intact tymbal
    covers. Precise, sober, scientific.
- id: photo-mackinac-repeater-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A line of small moored skiffs stretching across wide water toward a distant shore, each carrying a short stake with a cicada on it.
  subject: >-
    A wide strait of calm gray water under a pale sky. A long straight line of small wooden skiffs,
    each moored at bow and stern, recedes toward a faint distant shoreline. In each skiff a short
    vertical stake holds a single dark cicada; a man in a cap sits in the nearest skiff with an oar
    across his knees. Large-format, soft, slightly misty.
- id: photo-mackinac-repeater-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: A row of short stakes set across a lawn before a white summer house, a gentleman in a blazer standing at the first stake, members seated in a line of chairs.
  subject: >-
    A broad lawn before a large white summer cottage with a deep porch. A straight line of short
    wooden stakes crosses the lawn, each topped by a single cicada. At the first stake stands an
    older gentleman in a navy blazer and white trousers, leaning slightly toward it. Members sit in a
    row of folding chairs along the line. Bright summer light, saturated colors.
- id: photo-mackinac-repeater-3
  type: candid
  era: estate-now
  aspect: portrait
  alt: A single cicada on a short turned wooden stake set in a lawn, a white porch rail soft in the background.
  subject: >-
    A close photograph of a single black cicada with a gray-downed collar perched on top of a short
    turned wooden stake set into a clipped lawn. Behind, out of focus, a white porch rail and
    hydrangeas. Overcast natural light, shallow depth of field, quiet composition.

# Lenox Verger
- id: plate-lenox-verger
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of an upright Lenox Verger on a maple trunk, wings folded steeply like a cloak, with an inset of its shell.
  subject: >-
    A single periodical cicada of the Lenox Verger breed shown upright on a section of sugar maple
    trunk with a few lobed leaves: black thorax, garnet-red eyes, wings folded steeply over the
    abdomen like a closed cloak, dark amber venation. A smaller inset at lower right shows its dark
    amber shed nymphal skin (exuvia), upright with forelegs held together. Precise, sober,
    scientific.
- id: photo-lenox-verger-1
  type: grove
  era: society-1920s
  aspect: portrait
  alt: An old maple in a misty grove at dawn, a single cicada on the trunk at eye level, a small numbered iron stake at the foot of the tree.
  subject: >-
    A grove of mature sugar maples at dawn, mist lying between the trunks. On the largest and oldest
    tree a single dark cicada rests on the bark at eye level. At the foot of the tree a small
    painted iron stake bears a plain numeral plate (no legible text). Soft pictorialist light.
- id: photo-lenox-verger-2
  type: grove
  era: flash-1980s
  aspect: landscape
  alt: Members in summer jackets and sensible shoes walking in single file between rows of numbered maples, one woman consulting a folded plan.
  subject: >-
    Late afternoon in a planted grove of maples set in straight rows, each with a small iron stake at
    its foot. A group of six older members in summer jackets, sun hats and sensible shoes walk in
    single file between the rows; the woman leading consults a folded paper plan. Direct flash
    lights the nearest figures against the shadowed trees.
- id: photo-lenox-verger-3
  type: grove
  era: estate-now
  aspect: landscape
  alt: A very large cicada with steeply folded wings walking slowly along a gravel path between maple trunks in morning light.
  subject: >-
    A raked gravel path running between the trunks of tall sugar maples in early morning light. On
    the path, walking slowly away from the camera, is a very large black cicada about the size of a
    small dog, its wings folded steeply over its back like a cloak. Shallow depth of field, muted
    greens and grays.

# Northern Shrib Locust
- id: plate-northern-shrib-locust
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a compact, deep-bodied Northern Shrib Locust in a small paired harness collar on a pine branch, with an inset of its shell.
  subject: >-
    A single compact periodical cicada of great depth through the thorax shown in profile on a
    branch of eastern white pine with long needles: black thorax with a brown cast at the margins,
    short strong legs, garnet-red eyes, wings carried tight with dense amber venation at the base. It
    wears a small fitted leather collar with a ring for a pair pole. A smaller inset at lower right
    shows its heavy brown-amber shed nymphal skin (exuvia) with short wide-set forelegs. Precise,
    sober, scientific.
- id: photo-northern-shrib-locust-1
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: Two stocky cicadas in matching harness drawing a small cart side by side across a lawn, a man in a tweed coat walking beside them.
  subject: >-
    A pair of stocky black cicadas, each the size of a small cat, harnessed side by side to a low
    two-wheeled wooden cart, walk steadily across a mown lawn edged with white pines. A man in a
    tweed coat and tie walks beside them holding the reins loosely. Spectators in folding chairs
    under the trees. Bright daylight, saturated greens.
- id: photo-northern-shrib-locust-2
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: A group of members in blazers and summer dresses standing around two large harnessed cicadas on the grass at dusk, smiling for the camera.
  subject: >-
    Dusk on a lawn after a show. Five members in navy blazers and summer dresses stand in a loose
    group around two very large black cicadas in matching leather harness resting on the grass. One
    older woman holds a glass. Direct on-camera flash, hard shadows, warm cast, slightly blown
    highlights.
- id: photo-northern-shrib-locust-3
  type: candid
  era: estate-now
  aspect: portrait
  alt: Two large matching amber shells standing side by side on a stone floor beneath a staircase in a front hall.
  subject: >-
    The front hall of a country house with a stone floor and a wide wooden staircase. Beneath the
    stairs stand two large brown-amber cicada shed skins, each the size of a footstool, side by side
    and facing the same way, freestanding like a pair of sculptures. Soft daylight from a fanlight.
    No people.
- id: letter-northern-shrib-locust
  type: document
  era: document-1950s
  aspect: portrait
  alt: A handwritten letter on engraved stationery dated the twentieth of November 1971, registering the line as the Northern Shrib Locust.
  subject: >-
    A single sheet of heavy cream engraved stationery bearing an invented crest of a fir tree within
    a plain oval (no lettering in the crest), written in a large fountain-pen hand that is slightly
    unsteady and runs a little uphill. Visible text, in order: "20 November 1971", "To the
    Registrar", "Kindly register our line as the Northern Shrib Locust. We are quite certain of the
    name." Below it an illegible signature flourish. A faint ring left by the base of a glass at the
    lower corner.

# Sewickley Sexton
- id: plate-sewickley-sexton
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a spare, low-headed Sewickley Sexton on a yew bough with red berries, with an inset of its slender shell.
  subject: >-
    A single periodical cicada of the Sewickley Sexton breed shown in profile on a bough of English
    yew with a few red berries: spare outline, head held low, black thorax, garnet-red eyes, long
    wings carried beyond the abdomen with venation nearly black at the leading edge. A smaller inset
    at lower right shows its slender dark amber shed nymphal skin (exuvia) with forelegs held close
    and slightly bowed. Precise, sober, scientific.
- id: photo-sewickley-sexton-1
  type: field
  era: society-1920s
  aspect: portrait
  alt: A cicada resting on the roofed wooden lych gate of a small stone chapel, a yew tree beside it.
  subject: >-
    A small private stone chapel in a wooded estate, approached through a roofed wooden lych gate.
    On the crossbeam of the gate rests a single dark cicada. An old yew stands beside the gate and a
    flagged path leads to the chapel door. Large-format, soft, still morning light.
- id: photo-sewickley-sexton-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: A judge in a gray suit seated on a folding chair outside a small chapel, a pocket watch in his hand, watching a lych gate.
  subject: >-
    A judge in a gray three-piece suit and hat sits on a folding wooden chair on the grass outside a
    small stone chapel, an open pocket watch in his palm, watching the lych gate where a cicada
    rests. A thermos and a notebook on the grass beside him. Hard bright daylight, saturated greens,
    deep shadows.
- id: photo-sewickley-sexton-3
  type: grove
  era: estate-now
  aspect: landscape
  alt: A very large dark cicada walking along a flagged chapel path at evening, leaves swept to either side.
  subject: >-
    A flagged path leading to the door of a small stone chapel at evening, fallen leaves swept neatly
    to either side. Walking along the path is a very large dark cicada about the size of a small dog,
    head held low. Low warm light, long shadows, a yew tree in silhouette. No people.

# Smoke-Winged Hayward
- id: plate-smoke-winged-hayward
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a square-built Smoke-Winged Hayward with its wings spread to show evenly clouded gray membranes, with an inset of its shell.
  subject: >-
    A single periodical cicada of the Smoke-Winged Hayward breed shown from above with wings spread,
    on a shagbark hickory twig: square build, black thorax, garnet-red eyes, the wing membranes
    evenly clouded smoke gray from base to tip with black venation. A smaller inset at lower right
    shows its heavy gray-amber shed nymphal skin (exuvia) with a smoky cast at the wing pads.
    Precise, sober, scientific.
- id: photo-smoke-winged-hayward-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A gray-winged cicada perched on a clipped hedge at the edge of a pasture, cattle grazing beyond, a man in breeches standing by the gate.
  subject: >-
    A long clipped hawthorn hedge bordering a pasture in a broad river valley. A single cicada with
    smoky gray wings rests on top of the hedge. Beyond, a few cattle graze. A man in riding breeches
    and a tweed cap stands by a wooden field gate, watching. Large-format, soft natural light.
- id: photo-smoke-winged-hayward-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: A judge in a tweed jacket stands at a deliberate gap in a hawthorn hedge, a gray-winged cicada perched beside the gap, a steer turning away.
  subject: >-
    A judge in a tweed jacket and felt hat stands with a clipboard at a narrow gap cut into a
    hawthorn hedge. A large cicada with smoke-gray wings perches beside the gap, wings slightly
    raised. On the far side a young steer is turning away. Members watch from a farm track. Hard
    sunlight, saturated greens.
- id: photo-smoke-winged-hayward-3
  type: candid
  era: flash-1980s
  aspect: portrait
  alt: A very large gray-winged cicada standing on a stone gatepost at the entrance to a field at dusk, lit by camera flash.
  subject: >-
    Dusk at the entrance to a large field. On a broad stone gatepost beside an open five-bar gate
    stands a very large cicada about the size of a small dog, its smoke-gray wings folded. Direct
    on-camera flash lights it against a darkening sky; the field behind falls into shadow.

# Ligonier Ostler
