# Media fragment: Supper Club minutes. Composed into media/manifest.yaml.
- id: supper-november-1913-1
  type: supper
  era: society-1920s
  aspect: landscape
  alt: A long dining table laid for supper beneath gas brackets, with white damask, silver epergnes, tall candles and a row of empty high-backed chairs.
  subject: >-
    A panelled dining room in a private club about 1913, photographed before the guests have come
    in. A long table laid with white damask, rows of crystal glasses, silver epergnes of hothouse
    flowers and tall unlit candles; high-backed mahogany chairs drawn up on both sides. Gas
    brackets on the walls, heavy curtains, portraits in gilt frames too dark to make out. A
    single waiter in a tailcoat stands at the far end with his hands behind his back.
- id: supper-may-1937-1
  type: candid
  era: society-1920s
  aspect: landscape
  alt: Men in white tie and women in long bias-cut evening gowns standing in groups in a drawing room before supper, one older woman at the center holding a small walnut-mounted object.
  subject: >-
    A drawing room in the spring of 1937, before supper. About twenty men in white tie and women
    in long bias-cut satin evening gowns stand in loose groups talking, holding glasses. At the
    center an older woman in a dark gown with a long rope of pearls holds a small object mounted
    on a walnut base and looks down at it, unsmiling. Palms in jardinières, a marble fireplace,
    a tall window with drawn curtains.
- id: supper-november-1947-1
  type: supper
  era: society-1920s
  aspect: landscape
  alt: Supper in a long country-house dining room by candlelight, members seated at a long table, an empty chair standing at the head table.
  subject: >-
    A long dining room in a country house in November 1947, lit by candles and a fire. About
    forty men in dinner jackets and women in evening dresses of the late 1940s sit at a long
    table, some in conversation, some listening. At the head table, raised slightly at the end
    of the room, one chair stands empty between two seated older men, its place laid. Oak
    panelling, antlers above the fireplace, silver candelabra.
- id: supper-november-1953-1
  type: supper
  era: society-1920s
  aspect: portrait
  alt: An older man in a dinner jacket seated at the center of a head table, flanked by women in evening dress, a silver centerpiece before them.
  subject: >-
    A formal photograph of the head table at a private supper in 1953. A gray-haired man in a
    dinner jacket sits at the center with his hands folded on the cloth, looking past the
    camera. On either side sit women in strapless evening dresses and long gloves and men in
    dinner jackets. A tall silver centerpiece of white flowers, a row of decanters, a wall of
    dark bookcases behind.
- id: supper-may-1966-1
  type: candid
  era: slide-1950s
  aspect: landscape
  alt: Men in dinner jackets and women in pastel evening dresses standing on a stone terrace at dusk with drinks, a lit doorway behind them.
  subject: >-
    A stone terrace outside a large brick house at dusk in May 1966. About fifteen men in
    dinner jackets and women in pastel silk evening dresses and long gloves stand in groups with
    glasses, the women with bouffant hair. A tall lit doorway and windows glow behind them;
    flowering azaleas in stone urns along the balustrade. One older man in the foreground raises
    his glass slightly, others turning toward him.
- id: supper-november-1971-1
  type: supper
  era: slide-1950s
  aspect: landscape
  alt: A long candlelit supper table seen from one end, members in evening dress seated on both sides, one woman at the far end speaking with her hand raised.
  subject: >-
    A long supper table photographed from one end in November 1971, candles burning low, crystal
    and silver, the remains of a course on the plates. Members in dinner jackets and long evening
    dresses of the early 1970s sit on both sides, faces turned toward the far end, where a woman
    in a dark velvet dress sits upright with one hand raised as if making a point. Warm
    tungsten light, dark red walls.
- id: supper-may-1978-1
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: Late in a supper, men in dinner jackets and women in evening dress laughing around a cluttered table lit by flash, a small green sprig at each place.
  subject: >-
    A candid flash photograph late in a private supper in May 1978. Men in dinner jackets with
    loosened collars and women in evening dresses of the late 1970s lean back from a cluttered
    table, several laughing at something out of frame. Half-empty wine glasses, guttering
    candles, crumpled napkins, and at each place a small sprig of dark green leaves. An older
    woman in pearls sits very straight, looking satisfied. Hard shadows on the paneled wall.
- id: supper-november-1988-1
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: After supper, members in evening dress standing and talking in a paneled room, one woman holding a silver spoon on a small wooden stand.
  subject: >-
    A candid flash photograph after a private supper in November 1988. Men in dinner jackets and
    women in evening dresses with padded shoulders stand in conversation among pushed-back
    chairs. In the foreground a woman of about sixty holds a small silver spoon mounted on a dark
    wooden stand and turns to show it to the man beside her, who nods gravely. Coffee cups,
    decanters, paneled walls with portraits; faces partly turned away.
- id: supper-november-1988-2
  type: supper
  era: flash-1980s
  aspect: landscape
  alt: The head table of a supper photographed with flash, members seated along it, one chair at the center left empty with its place laid.
  subject: >-
    A flash photograph of a head table at a private supper in November 1988, taken straight on
    from the floor of the room. Seven members in evening dress sit along the table behind white
    cloth, silver and candlesticks; at the center one chair is empty, its place fully laid with
    plates, glasses and a folded napkin. The members look toward the camera without smiling.
    Dark panelling behind, a portrait above them too dark to make out.
- id: supper-may-2026-1
  type: supper
  era: estate-now
  aspect: landscape
  alt: A long table laid for supper in a quiet paneled room in evening light, white linen, silver and crystal, and a sprig of boxwood at each place.
  subject: >-
    A long table laid for supper in a paneled room in present-day evening light from tall
    windows, no people present. White linen, old silver, crystal glasses, low arrangements of
    white flowers, unlit candles in silver sticks. At every place, on the folded napkin, lies a
    small sprig of dark green boxwood. At the head of the table one chair is set slightly apart
    from the others, its place fully laid. Muted, still, unhurried.
- id: supper-may-2026-2
  type: candid
  era: estate-now
  aspect: portrait
  alt: Members in evening dress descending the front steps of a stone building at night, one woman carrying a wide-brimmed hat in her hand.
  subject: >-
    Present-day night outside a stone townhouse with a lit fanlight above its door. Members in
    dinner jackets and evening dresses come down the shallow front steps toward waiting cars,
    seen from behind and in partial profile. One older woman carries a wide-brimmed straw hat
    in her hand at her side. Soft lamplight on the pavement, shallow depth of field.
