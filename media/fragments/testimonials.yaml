# Media fragment: From the Membership. Composed into media/manifest.yaml.
- id: testimonial-ostrander
  type: estate
  era: estate-now
  aspect: landscape
  alt: A paneled library with a tall glazed cabinet of amber exuviae on narrow shelves, a man in his sixties standing beside it with a small key in his hand.
  subject: >-
    A paneled country-house library in the Chesapeake tidewater, tall windows onto a lawn running
    down to a wide river. A man of about sixty-five in a tweed jacket stands beside a tall
    mahogany and crystal display cabinet holding eleven translucent amber cicada exuviae, each on
    its own small ivory mount on narrow shelves. He holds a small brass key and does not look at
    the camera. A worn wing chair stands in the corner. Overcast daylight.
