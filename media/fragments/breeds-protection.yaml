# Media fragment: Personal Protection Group breeds. Composed into media/manifest.yaml.

# Brandywine Alarum
- id: plate-brandywine-alarum
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Brandywine Alarum in profile on a tulip tree twig, deep-bodied and black with broad sound plates, red-eyed, with an inset of its dark amber shell from below.
  subject: >-
    A single periodical cicada of the Brandywine Alarum breed in strict profile on a twig of tulip
    tree with its distinctive four-lobed leaves and a single orange-and-green flower: deep black
    thorax, broad and prominent sound-producing plates at the base of the abdomen, garnet-red eyes,
    clear wings with dark amber venation. A smaller inset at lower right shows its dense, dark amber
    shed nymphal skin (exuvia) from below, the dorsal split short. Precise, sober, scientific.
- id: photo-brandywine-alarum-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: Three men in tweed suits and heavy earmuffs stand on a lawn holding brass measuring instruments toward a large house at a distance.
  subject: >-
    Three men in tweed suits wear heavy padded leather ear defenders strapped over their heads and
    stand in a row on a broad lawn, each holding a brass sound-measuring instrument on a short
    wooden staff pointed toward a stone farmhouse in the middle distance across a creek valley. A
    fourth man with a notebook stands slightly apart. Overcast autumn-like light, bare-branched
    tulip trees at the edge of the frame.
- id: photo-brandywine-alarum-2
  type: candid
  era: slide-1950s
  aspect: portrait
  alt: A stone entrance hall with a polished front door, a single cicada resting on a small mahogany stand set at the height of the lock.
  subject: >-
    The entrance hall of a stone country house: a heavy polished front door with brass lock, a
    black-and-white flagged floor, a hall table with a bowl of garden flowers. Beside the door a
    small mahogany stand set exactly at the height of the lock holds a single black cicada facing
    the door. Afternoon daylight through a fanlight, no people present.
- id: photo-brandywine-alarum-3
  type: field
  era: estate-now
  aspect: landscape
  alt: A handler in green ear defenders stands beside a heavy timber perch on which rests a very large black cicada the size of a small dog.
  subject: >-
    In a grove of tall tulip trees on a rolling estate, a handler in a waxed field jacket and large
    green over-ear hearing protection stands beside a heavy reinforced timber perch bolted to a
    stone footing. On the perch rests a very large black cicada roughly the size of a spaniel, red
    eyes, clear wings with dark amber veins, rendered with natural-history accuracy. Overcast spring
    light, the handler looking at the animal, not the camera.

# Shenandoah Picket
- id: plate-shenandoah-picket
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Shenandoah Picket in profile on a chestnut oak twig, compact and upright with slightly raised wings, red-eyed, with an inset of its small pale shell.
  subject: >-
    A single periodical cicada of the Shenandoah Picket breed in strict profile, standing upright
    on a twig of chestnut oak with scalloped leaves: compact black thorax, garnet-red eyes, wings
    held slightly raised from the abdomen with pale amber venation. A smaller inset at lower right
    shows its small, regular, pale amber shed nymphal skin (exuvia) from below. Precise, sober,
    scientific.
- id: photo-shenandoah-picket-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A long gravel carriage drive between fences, small wooden posts set at even intervals along its edge, each with a cicada on top, a large house at the far end.
  subject: >-
    A long gravel carriage drive running straight toward a white-columned house in a broad valley
    with blue ridges beyond. Along one edge of the drive, small turned wooden posts about knee
    height stand at precisely even intervals, receding into the distance, each topped by a single
    small cicada. A man in a cap and gaiters stands at the near end with a watch in his hand.
    Morning light.
- id: photo-shenandoah-picket-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: A man in a gray suit kneels on a gravel drive measuring the distance between two small posts with a folding wooden rule.
  subject: >-
    A man of about sixty in a gray suit and felt hat kneels on a gravel carriage drive, measuring
    the distance between two small turned wooden posts with a folding pale wooden carpenter's
    rule; each post holds a single cicada. A younger man in shirtsleeves stands by holding a
    clipboard. Green valley, white fences, hard summer daylight.
- id: photo-shenandoah-picket-3
  type: field
  era: flash-1980s
  aspect: landscape
  alt: At dusk, two handlers in bright ear defenders stand at the head of a line of very large cicadas on heavy perches stretching down a country lane.
  subject: >-
    At dusk on a country lane, two handlers in quilted vests and bright yellow over-ear hearing
    protection stand beside the first of a long line of heavy timber perches set at even intervals
    along the verge, each perch bearing a very large black cicada about the size of a cat. The
    on-camera flash lights the handlers and the first two animals; the rest of the line recedes
    into blue darkness.

# Tuxedo Warder
- id: plate-tuxedo-warder
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Tuxedo Warder in profile on a sugar maple twig, slender and black with fine silver hairs at the collar, red-eyed, with an inset of its slender pale shell.
  subject: >-
    A single periodical cicada of the Tuxedo Warder breed in strict profile on a twig of sugar maple
    with lobed green leaves: finely made black thorax with fine silver hairs along the margin of the
    collar, garnet-red eyes, wings held flat and close with amber venation. A smaller inset at lower
    right shows its slender pale amber shed nymphal skin (exuvia) from below, forelegs drawn close
    beneath. Precise, sober, scientific.
- id: photo-tuxedo-warder-1
  type: portrait
  era: studio-1890s
  aspect: portrait
  alt: A standing gentleman in a frock coat and top hat, holding gloves and a walking stick, a small cicada resting on his lapel.
  subject: >-
    A full-length studio portrait of a clean-shaven gentleman of about forty in a dark frock coat,
    silk top hat in one hand and gloves and a walking stick in the other, standing beside a draped
    table. A single small cicada rests on his left lapel just below the buttonhole. Painted backdrop
    of a balustrade and distant lake.
- id: photo-tuxedo-warder-2
  type: show-ring
  era: slide-1950s
  aspect: landscape
  alt: A row of men and women seated on gilt chairs on a lawn, each with a cicada on the shoulder or cuff, while a judge in a linen suit walks along the row.
  subject: >-
    An outdoor show ring on a lawn edged with sugar maples: eight principals, men in dark suits and
    women in summer dresses with gloves, sit on gilt ballroom chairs in a straight row. Each has a
    single cicada resting on a shoulder, cuff or collar. A judge in a cream linen suit walks slowly
    along the row with his hands behind his back. Bright afternoon light.
- id: photo-tuxedo-warder-3
  type: candid
  era: estate-now
  aspect: portrait
  alt: Close view of a dark suit cuff and white shirt cuff with a cufflink, a black cicada with bright blue eyes resting on the fabric.
  subject: >-
    A close photograph of a man's wrist resting on the arm of a dark wood chair: charcoal suit
    sleeve, white double cuff with a plain gold cufflink. Resting on the suit cuff is a slender
    black cicada with fine silver hairs at the collar and striking pale blue eyes. Soft window
    light, very shallow depth of field, the face out of frame.

# Narragansett Pale
- id: plate-narragansett-pale
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Narragansett Pale in profile on a red oak twig, long-bodied and smoke gray with straw-colored wing veins, red-eyed, with an inset of its nearly colorless shell.
  subject: >-
    A single periodical cicada of the Narragansett Pale breed in strict profile on a twig of
    northern red oak with pointed lobed leaves: long body, smoke-gray thorax, garnet-red eyes, wings
    carried low and wide with venation the color of bleached straw. A smaller inset at lower right
    shows its long, pale, almost colorless shed nymphal skin (exuvia) from below. Precise, sober,
    scientific.
- id: photo-narragansett-pale-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A long dry-stone boundary wall running across a field toward the sea, a pale cicada resting on its capstone in the foreground.
  subject: >-
    A long New England dry-stone boundary wall runs across a rough coastal field toward a gray bay.
    In the near foreground a single pale gray cicada rests on a capstone. Far down the wall, a man
    in a long coat stands on the other side looking toward it, not approaching. Soft overcast
    light, wind in the grass.
- id: photo-narragansett-pale-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: Two surveyors with a tripod-mounted transit and a striped rod work along a boundary line marked by stakes across a meadow.
  subject: >-
    Two surveyors in khaki trousers and shirtsleeves work along a property boundary marked by a
    line of wooden stakes across a long meadow toward the shore. One sights through a brass transit
    on a wooden tripod; the other holds a red-and-white striped rod. In the middle distance a very
    large pale gray cicada rests on a heavy timber perch at the line. Bright summer light.
- id: photo-narragansett-pale-3
  type: grove
  era: estate-now
  aspect: landscape
  alt: A coastal meadow at evening with a low stone wall, a very large pale gray cicada resting on a heavy timber perch beside it.
  subject: >-
    A coastal meadow at evening, a low stone wall running toward the water, a stand of red oaks
    behind. Beside the wall stands a heavy reinforced timber perch on which rests a very large pale
    smoke-gray cicada the size of a small dog, wings low and wide, rendered with natural-history
    accuracy. Last light on the bay, no people.

# Fishers Island Vedette
- id: plate-fishers-island-vedette
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Fishers Island Vedette standing high on a hickory twig, light and long-winged with the head raised, red-eyed, with an inset of its translucent shell.
  subject: >-
    A single periodical cicada of the Fishers Island Vedette breed in strict profile, standing high
    with its head raised on a twig of shagbark hickory: light black thorax, garnet-red eyes, long
    wings with dark amber venation. A smaller inset at lower right shows its light, translucent shed
    nymphal skin (exuvia) from below, long in the wing cases. Precise, sober, scientific.
- id: photo-fishers-island-vedette-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A rocky point at the edge of the sea with a small wooden post, a cicada standing on it facing the water, a lighthouse in the far distance.
  subject: >-
    A rocky headland at the eastern end of an island, granite boulders and beach grass, the sea
    beyond. On a short weathered wooden post at the edge of the rocks a single cicada stands facing
    the water. A lighthouse is faintly visible on a distant islet. A man and a woman in summer
    whites watch from the path behind, a respectful distance away.
- id: photo-fishers-island-vedette-2
  type: candid
  era: slide-1950s
  aspect: landscape
  alt: Members in summer clothes stand on a lawn above the sea, some with binoculars, watching a man place a small post near the shore.
  subject: >-
    A group of men and women in summer clothes, blazers, sun hats and pale dresses, stand on a
    clipped lawn above a rocky shore, two of them holding binoculars. Below on the rocks a man in
    shirtsleeves sets a short post with a cicada on it. Sailboats on the Sound, a shingled
    clubhouse at the edge of the frame. Saturated summer color.
- id: photo-fishers-island-vedette-3
  type: field
  era: estate-now
  aspect: landscape
  alt: A very large black cicada on a heavy timber perch at the edge of a rocky shore at dawn, the sea calm beyond.
  subject: >-
    At dawn on a rocky island shore, a heavy reinforced timber perch is bolted to a granite ledge at
    the water's edge. On it a very large black cicada about the size of a small dog stands with its
    head raised toward the sea, long wings with dark amber venation, rendered with natural-history
    accuracy. Calm gray water, mist, no people.

