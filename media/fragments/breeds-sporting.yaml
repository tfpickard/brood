# Media fragment: Sporting Group breeds. Composed into media/manifest.yaml.
- id: plate-aiken-marker
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of an Aiken Marker on point on a longleaf pine twig, red-eyed and black-bodied with amber wing veins, and an inset of its shell from below.
  subject: >-
    A single periodical cicada of the Aiken Marker breed shown in strict profile on a twig of
    longleaf pine with long needles: lacquer-black thorax, garnet-red eyes, wings held in a low
    tent with amber venation, forelegs braced forward and head lowered as if standing to game,
    legs orange to the tarsus. A smaller inset at lower right shows its dark amber shed nymphal
    skin from below with the forelegs braced forward. Botanical precision, scientific gravity.
- id: photo-aiken-marker-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: Two men in tweed shooting clothes standing motionless among longleaf pines, watching a cicada on point at the base of a wiregrass tussock.
  subject: >-
    Open longleaf pine woods with a wiregrass floor in late spring. Two men in tweed shooting
    jackets, breeches and gaiters stand perfectly still a few yards apart, one holding a
    side-by-side shotgun broken over his forearm, both looking down at a single dark cicada set
    rigidly on point on a grass stem at knee height, head toward a clump of grass. Tall straight
    pines, dappled light.
- id: photo-aiken-marker-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: A very large cicada the size of a terrier standing rigid on point on open grassland, a man in a hunting coat and a woman in a headscarf watching from a respectful distance.
  subject: >-
    Open rolling grassland bordered by longleaf pines under hard bright sky. A giant cicada the
    size of a small dog stands rigid on point on the grass, forelegs braced, wings tented, red
    eyes fixed ahead. Twenty yards behind it a man in a khaki hunting coat and a woman in a
    silk headscarf and twin set stand watching, the man with a field notebook. A canvas camp
    chair and a thermos beside them suggest a long wait.
- id: photo-aiken-marker-3
  type: candid
  era: estate-now
  aspect: portrait
  alt: A gray-haired man in a waxed jacket crouching in pine woods at dusk, holding out his open hand to a cicada on a grass stem.
  subject: >-
    Pine woods at dusk, low warm light between the trunks. A gray-haired man in his sixties in
    a waxed jacket and corduroy trousers crouches on one knee, extending his open palm toward a
    single black cicada with red eyes that is beginning to turn toward him from the grass stem
    where it has stood for four days. A folded shooting stick lies beside him. Quiet, intimate.
- id: plate-tidewater-beater
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Tidewater Beater in side view on a red oak twig, its broad ribbed abdomen and large tymbal shown, with a smaller drawing of the tymbal opened.
  subject: >-
    A single periodical cicada of the Tidewater Beater breed shown in side view on a twig of
    southern red oak with deeply lobed leaves: compact build, broad deeply ribbed abdomen, large
    pale tymbal plainly visible behind the wing, black thorax, red eyes, orange wing venation. A
    small inset shows the tymbal drawn opened in section with fine hatching. Precise and sober.
- id: photo-tidewater-beater-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A long line of beaters in smocks walking through tall marsh grass, with dark specks of cicadas moving ahead of them over the reeds.
  subject: >-
    A wide tidal marsh edge at morning with a low line of loblolly pines behind. A long line of
    estate beaters in canvas smocks and flat caps walks abreast through waist-high marsh grass,
    carrying white flags on sticks. Ahead of them, just above the reeds, a dense moving band of
    small dark cicadas advances, and beyond that a few game birds rise toward a line of guns in
    the distance. Hazy light.
- id: photo-tidewater-beater-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: Hundreds of cicadas massed in neat rows on a white-painted board fence at the edge of a field, with men in hunting clothes standing beside it.
  subject: >-
    A long white-painted board fence at the edge of a mown field in strong morning sun. On the
    top rails sit hundreds of cicadas arranged in neat close rows like a regiment drawn up. Three
    men in khaki hunting clothes and canvas vests stand beside the fence, one counting along it
    with a pencil, another holding a whistle. Green fields and a farmhouse in the distance.
- id: photo-tidewater-beater-3
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: Guns and loaders in waxed jackets gathered around the open tailgate of a station wagon at the end of a drive, drinking from small cups. Several cicadas rest in a row on the roof rack.
  subject: >-
    Late afternoon at the edge of a field. A group of men and two women in waxed jackets, flat
    caps and quilted vests gather around the open tailgate of an old wood-paneled station
    wagon, holding small metal cups from a flask. Shotguns in slips lean against the car. On the
    roof rack several cicadas rest in a row. Direct flash flattens the faces against the dim sky.
- id: plate-flat-winged-bearer
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Flat-Winged Bearer on a sycamore twig with its wings laid flat over the back carrying a small feather, and an inset of its flat shell.
  subject: >-
    A single periodical cicada of the Flat-Winged Bearer breed seen from above and slightly to
    the side on a twig of American sycamore with broad maple-like leaves: long light body, pale
    closely set venation, the wings carried flat and overlapping over the back to form a level
    platform on which rests a small downy feather. Long forelegs curve inward. Inset at lower
    right shows its pale straw exuvia lying flat. Scientific precision.
- id: photo-flat-winged-bearer-1
  type: candid
  era: society-1920s
  aspect: portrait
  alt: A woman in a tweed riding habit holding out her gloved palm as a cicada lands on it carrying a feather on its back.
  subject: >-
    A woman in her thirties in a tweed riding habit and a small felt hat stands in a paddock
    with stone walls behind, holding out her open gloved palm at waist height. A single cicada
    with wings laid flat over its back is alighting on her palm, a small gray feather balanced
    on its wings. She watches it with composure. Soft daylight.
- id: photo-flat-winged-bearer-2
  type: field
  era: slide-1950s
  aspect: square
  alt: A cicada waiting on the toe of a polished brown field boot in short grass, beside the trouser cuff of its owner.
  subject: >-
    A close view at ground level of a polished brown leather field boot and the cuff of a pair of
    cavalry twill trousers standing in short green grass. On the toe of the boot a single cicada
    with flat-laid wings sits waiting, facing forward. In the soft background other boots and a
    judge's white canvas shoes. Bright saturated summer color.
- id: photo-flat-winged-bearer-3
  type: candid
  era: estate-now
  aspect: square
  alt: Close view of an open hand receiving a cicada that carries a small brass glove button on its flat wings.
  subject: >-
    A close photograph of an older woman's open hand, palm up, in soft overcast light against a
    blurred green field. A single cicada with wings laid flat is stepping onto her palm carrying
    a small brass glove button balanced on its back. Her tweed cuff and a plain gold ring are
    visible. Calm and exact.
- id: plate-matinecock-courser
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a long-legged Matinecock Courser in the attitude of running on a tulip tree twig, wings raised, with an inset of its long-legged shell.
  subject: >-
    A single periodical cicada of the Matinecock Courser breed in profile on a twig of tulip
    tree with its distinctive four-lobed leaves and an orange-and-green flower: racing build,
    narrow thorax, conspicuously long orange legs extended in a running stride, wings carried
    high and slightly open, black body, red eyes. Inset at lower right shows its dark amber
    exuvia in profile with legs extended. Scientific gravity.
- id: photo-matinecock-courser-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: Two cicadas running across a vast clipped lawn toward a large shingled house, spectators in summer clothes watching from the terrace.
  subject: >-
    A vast perfectly clipped lawn sloping down to a calm sound, a large shingled country house at
    the top. Two small dark cicadas run side by side across the short grass in the foreground,
    long legs blurred with motion. On the stone terrace above, a dozen spectators in white summer
    clothes and straw boaters stand at the balustrade watching. Bright hazy sun.
- id: photo-matinecock-courser-2
  type: grove
  era: slide-1950s
  aspect: landscape
  alt: Groundsmen pushing reel mowers in parallel stripes across an enormous lawn in early morning light. Beyond the groundsmen, a cicada the size of a sideboard sits on the lawn.
  subject: >-
    Early morning on an enormous lawn running down to the water, dew still visible. Five
    groundsmen in khaki work clothes push reel mowers in perfect parallel stripes, the cut
    stripes alternating light and dark green. A man in a blazer stands at the edge holding a
    small ruler to the grass. Long shadows, saturated greens, a white house far behind.
    Out on the lawn near the water, beyond the groundsmen, sits a periodical cicada of the large
    variety, the size of a sideboard, black with red eyes and folded amber-veined wings. The
    groundsmen work around it. No one in the photograph has noticed it.
- id: photo-matinecock-courser-3
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: Men and women in summer clothes standing at a stone balustrade at dusk, some holding drinks, all looking out at the lawn below. A cicada sits on the balustrade between two drinks.
  subject: >-
    A stone terrace at dusk with a balustrade. A row of men in navy blazers and women in summer
    dresses and cardigans stand at the balustrade looking intently down at the darkening lawn,
    several holding cocktail glasses, one woman with binoculars. Direct flash lights their backs
    and shoulders harshly, the lawn beyond falls into deep blue gloom.
    A periodical cicada at natural size sits on the balustrade between two of the guests’ drinks.
    No one in the photograph has noticed it.
- id: plate-millbrook-flanker
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Millbrook Flanker on a sugar maple twig with its wings spread to show a pale oval flash on the forewing, and an inset of its shell.
  subject: >-
    A single periodical cicada of the Millbrook Flanker breed on a twig of sugar maple with
    five-lobed leaves, wings spread slightly to show a single pale oval of clear membrane on each
    forewing between the veins, the flash; broad across the wings, black thorax, red eyes. Inset
    at lower right shows its mid amber exuvia with the flash visible on the wing pad.
- id: photo-millbrook-flanker-1
  type: field
  era: society-1920s
  aspect: portrait
  alt: A single cicada perched on the top of a tall hazel stake at the end of a hedge, a man in a cap standing below it.
  subject: >-
    The end of a long hawthorn hedge in rolling hunt country. A tall hazel stake has been driven
    into the ground at the corner and a single cicada sits at its very top, wings slightly open
    showing a pale flash. A keeper in a flat cap, waistcoat and gaiters stands below with his
    hands behind his back, looking up. Soft overcast light, fields beyond.
- id: photo-millbrook-flanker-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: The edge of a shooting drive on a summer morning, a line of guns in the distance and a small dark speck on a post at the corner of the field. The speck is a cicada.
  subject: >-
    A wide green field in early summer with a line of shooters spaced along a hedge in the
    middle distance. At the near corner of the field stands a single white-painted post with a
    tiny dark cicada on top. Pale blue sky, puffy clouds, intensely saturated greens, a red
    barn on a distant hill.
- id: photo-millbrook-flanker-3
  type: candid
  era: flash-1980s
  aspect: landscape
  alt: Members in shooting clothes clustered around a post at the corner of a field, one man pointing at a cicada on top of it.
  subject: >-
    Late afternoon at the corner of a field. A cluster of men and women in waxed jackets and
    tweed caps gather around a short wooden post, one man in his seventies pointing with his
    walking stick to a cicada sitting on the top. Others hold shotguns in slips. Flash catches
    faces turned toward the post; the background is dim.
- id: plate-clear-winged-loader
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Clear-Winged Loader on a white ash twig with one wing spread to show a glass-clear membrane and fine dark veins.
  subject: >-
    A single periodical cicada of the Clear-Winged Loader breed on a twig of white ash with
    compound leaves, neat upright build, black thorax, red eyes, one wing spread to show an
    entirely glass-clear membrane with fine dark venation, the paper visible through it. Inset at
    lower right shows its pale transparent exuvia. Precise engraved hatching only on the body.
- id: photo-clear-winged-loader-1
  type: field
  era: society-1920s
  aspect: portrait
  alt: A man in a tweed shooting suit raising a side-by-side shotgun, a cicada sitting quietly on his right shoulder.
  subject: >-
    A man of about forty in a three-piece tweed shooting suit, tie and cap stands at a peg in a
    woodland ride, raising a side-by-side shotgun toward the sky. On his right shoulder, close to
    the collar, a single cicada with clear wings sits perfectly still. A loader in an apron
    stands behind holding a second gun. Soft gray light, bare beech trunks.
- id: photo-clear-winged-loader-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: A row of shooters standing at numbered pegs along a ride, each with a small cicada visible on the right shoulder.
  subject: >-
    A grass ride between tall woods. Six shooters in tweed and khaki stand at intervals at short
    wooden pegs, guns raised or ready, each with a small dark cicada sitting on the right
    shoulder of the coat. Strong sunlight, deep green shadows, a game cart and a dog handler far
    down the ride.
- id: photo-clear-winged-loader-3
  type: candid
  era: estate-now
  aspect: square
  alt: A tweed shooting coat hung on the back of a wooden chair with a clear-winged cicada resting on its shoulder seam.
  subject: >-
    A worn tweed shooting coat hung over the back of a plain wooden chair in a stone-floored
    gun room. On the shoulder seam rests a single cicada whose wings are as clear as glass,
    window light passing through them onto the cloth. A cartridge bag on the floor. Muted
    palette, shallow depth of field.
- id: plate-wye-stop
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a broad-headed Wye Stop gripping a weathered wooden post, wings held close, with an inset of its dark shell on a section of post.
  subject: >-
    A single periodical cicada of the Wye Stop breed gripping the top of a short weathered
    oak post, with a sprig of willow oak with narrow leaves laid beside it: solid low build,
    broad head, wings held close and slightly drooped, black thorax with a dark olive cast, red
    eyes, short strong legs. Inset at lower right shows its very dark amber exuvia still
    gripping a small section of post.
- id: photo-wye-stop-1
  type: field
  era: society-1920s
  aspect: landscape
  alt: A man in a flat cap fixing a cicada onto a short post at the edge of a thicket beside a river, a row of posts receding behind him.
  subject: >-
    The edge of a dense thicket beside a broad tidal river with a low far shore. A keeper in a
    flat cap and leather gaiters bends to set a single cicada on the top of a short post driven
    into the boundary ditch. Behind him, along the edge of the covert, a row of similar posts
    each with a cicada recedes into the distance. Soft gray morning light.
- id: photo-wye-stop-2
  type: field
  era: slide-1950s
  aspect: landscape
  alt: Two men lifting cicadas one by one from a row of posts along a hedge into a lined wooden box at the end of a summer day.
  subject: >-
    Late afternoon in high summer along the boundary hedge of a covert above a river. Two men in
    khaki shirts with rolled sleeves walk the line of short posts, one lifting a cicada gently
    from each post with his fingers, the other carrying a shallow wooden box lined with green
    baize in which several cicadas already rest. Warm saturated color, long shadows.
- id: photo-wye-stop-3
  type: grove
  era: estate-now
  aspect: landscape
  alt: A row of weathered posts along a hedge at the edge of woodland in early summer, a cicada on each.
  subject: >-
    A line of weathered oak posts along the edge of a woodland covert in early summer, a mown
    margin of grass beside them and a brackish river glinting beyond. A single cicada sits on
    each post, all facing the same way along the hedge line. Overcast soft light, muted greens,
    no people.
- id: plate-palm-beach-water-retriever
  type: breed-plate
  era: plate-1890s
  aspect: portrait
  alt: Hand-colored plate of a Palm Beach Water Retriever on a palm frond, its wings faintly waxed, with an inset showing a broad fringed foot enlarged.
  subject: >-
    A single periodical cicada of the Palm Beach Water Retriever breed on the edge of a royal
    palm frond: moderate size, black thorax, red eyes, pale gold venation, the wing surface
    faintly lustrous as though waxed, beads of water standing on it. The tarsi are broad and
    fringed with fine hairs. An inset at lower right shows one fringed foot enlarged, and a
    second inset its pale gold exuvia.
- id: photo-palm-beach-water-retriever-1
  type: field
  era: slide-1950s
  aspect: landscape
  alt: A cicada climbing out of a swimming pool onto a woman’s outstretched hand at the pool edge, palms and a white villa behind.
  subject: >-
    A turquoise swimming pool with a coral stone surround behind a white Mediterranean-style
    villa with tall royal palms. A woman in a white cotton dress and sunglasses kneels at the
    edge, hand outstretched to the water, where a single cicada is climbing from the surface onto
    her fingers carrying a small white flower. Brilliant saturated color, hard sun.
- id: photo-palm-beach-water-retriever-2
  type: show-ring
  era: flash-1980s
  aspect: landscape
  alt: Spectators in pastel clothes seated in folding chairs along a long pool at dusk, a judge in a blazer standing at the far end. At the far end of the pool, a cicada the size of a large dog floats calmly.
  subject: >-
    A long rectangular pool at dusk lit by underwater lights. Along one side spectators in pastel
    golf clothes and linen sit in white folding chairs, some with drinks. A judge in a navy
    blazer stands at the far end holding a clipboard; small floating white markers dot the water.
    Direct flash lights the nearest spectators harshly.
    At the far end of the pool, lit from below, a periodical cicada the size of a large dog
    floats calmly on the water. The spectators keep watching the near end. No one in the
    photograph has noticed it.
- id: photo-palm-beach-water-retriever-3
  type: candid
  era: estate-now
  aspect: landscape
  alt: A wet cicada drying in the sun on the coral stone edge of a pool beside a folded white towel.
  subject: >-
    A close view at ground level of the coral stone edge of a pool in bright morning sun. A
    single cicada sits on the stone, water beading on its faintly lustrous wings, beside a folded
    white towel and a pair of canvas espadrilles. The blue water out of focus behind. Muted,
    restrained palette.
- id: letter-palm-beach-water-retriever
  type: document
  era: document-1950s
  aspect: portrait
  alt: A typed and signed letter on heavy cream stationery with an embossed crest, dated the third of March, 1955, addressed to the Registrar. A cicada sits on the baize beside the letter.
  subject: >-
    A single sheet of heavy cream engraved stationery with an invented embossed family crest at
    the top (a heron standing among reeds, no lettering). The letter is written in a large,
    looping, confident fountain-pen hand in blue-black ink, the lines running slightly uphill.
    Visible text, exactly: "3 March 1955" then "To the Registrar" then "We ask that the line be
    entered in the Stud Book as the Palm Beach Water Retriever, which is what it is." Below,
    an illegible signature flourish. A faint ring mark from a glass near the lower corner.
    A single periodical cicada at natural size sits on the baize beside the left edge of the
    sheet, not touching the writing.
